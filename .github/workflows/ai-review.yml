name: AI Code Review

on:
  pull_request:
    branches: [ main, develop, master ]
  push:
    branches: [ main, master ]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml jsonschema
    
    - name: Run AI Review
      run: |
        python scripts/ai_review.py
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload Review Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-review-report
        path: |
          ai_review_report.json
          ai_review_summary.txt
    
    - name: Comment on PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          let report = 'AI Review report not found.';
          try {
            report = fs.readFileSync('ai_review_summary.txt', 'utf8');
          } catch(e) {}
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## AI Code Review Result\n\n```\n' + report + '\n```'
          });
    
    - name: Fail if critical issues
      if: always()
      run: |
        if [ -f ai_review_report.json ]; then
          CRITICAL=$(python -c "import json; d=json.load(open('ai_review_report.json')); print(d.get('critical_count',0))")
          if [ "$CRITICAL" -gt 0 ]; then
            echo "Found $CRITICAL critical issues!"
            exit 1
          fi
        fi
