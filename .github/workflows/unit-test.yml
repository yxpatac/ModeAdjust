name: Simulink Unit Test


on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]
  workflow_dispatch:


env:
  REPO_PATH: C:\1work_project\6-557\Model\ModeAdjust


jobs:
  unit-test:
    runs-on: self-hosted
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
    - name: Sync local repo
      shell: cmd
      run: |
        echo [CI] Syncing local repo to ${{ github.sha }} ...
        set HTTPS_PROXY=http://10.203.49.76:8080
        set HTTP_PROXY=http://10.203.49.76:8080
        cd /d ${{ env.REPO_PATH }} 
        git fetch origin main
        git checkout ${{ github.sha }} 
        echo [CI] Repo synced.
        
    - name: Run MATLAB Unit Tests
      shell: powershell
      run: |
        Write-Host "[CI] Starting MATLAB unit tests..."
        Write-Host "[CI] Workspace: ${{ env.REPO_PATH }}"
        matlab -batch "cd('${{ env.REPO_PATH }}'); run('scripts/run_ci_tests.m')"
      env:
        GITHUB_WORKSPACE: ${{ env.REPO_PATH }} 

    - name: Process Test Results
      if: always()
      shell: powershell
      run: |
        $xmlPath = "${{ env.REPO_PATH }}\test-results.xml"
        if (Test-Path $xmlPath) {
            $xml = Get-Content $xmlPath -Raw
            Write-Host "=== Test Results ==="
            if ($xml -match 'tests="(\d+)"') { Write-Host "Total: $($Matches[1])" }
            if ($xml -match 'failures="(\d+)"') { Write-Host "Failures: $($Matches[1])" }
            if ($xml -match 'errors="(\d+)"') { Write-Host "Errors: $($Matches[1])" }
            if ($xml -match 'skipped="(\d+)"') { Write-Host "Skipped: $($Matches[1])" }
            
            if ($xml -match 'failures="([1-9]\d*)"|errors="([1-9]\d*)"') {
                Write-Host "::error::Unit tests have failures or errors"
                exit 1
            }
            Write-Host "::notice::All unit tests passed"
        } else {
            Write-Host "::warning::No test-results.xml found at $xmlPath"
        }
